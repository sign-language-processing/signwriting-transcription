name: Overfit Test


on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]


jobs:
  test:
    name: Overfit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Requirements
        run: pip install ".[dev]"

      - name: Prepare data and model
        run: make overfit prepare

      - name: Train model to overfit
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: make overfit train

      - name: Test Overfitting
        run: |
          if jq -e '.best_metric > 0.7' example/results/trainer_state.json > /dev/null; then
            echo "Overfit test passed."
          else
            echo "Overfit test failed: best_metric <= 0.5"
            exit 1
          fi